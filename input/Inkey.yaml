units:
  kx: cx
  ky: cy
  px: kx + 4
  py: ky + 4
  $default_width: cx
  $default_height: cy

points:

  key:
    padding: 1ky
    spread: 1kx

  zones:

    main:

      anchor: 
        shift: [150, -150]

      rows:
        bottom:
        home:
        top:
        num:
      columns:
        far:
        pinkie:
        ring:
          key.stagger: 0.75ky
        middle:
          key.stagger: 0.25ky
        index:
          key.stagger: -0.25ky
        inner:
          key.stagger: -0.5ky

    thumb:
    
      anchor:
        ref: main_inner_bottom
        shift: [0, -1.5ky]
      rows:
      columns:
        inner:
        middle:
          key:
            rotate: -20
            shift: [2.5,-3.5]
        outer:
          key:
            rotate: -40
            shift: [2.5,-14]

outlines:
  raw:
    - what: rectangle
      where: true
      size: [px, py]
  keys:
    - what: rectangle
      where: true
      size: [kx-0.5, ky-0.5]
  board:
    - what: polygon
      operation: stack
      points:
        - ref: main_far_num
          shift: [-0.5px, 0.5py]
        - ref: main_far_bottom
          shift: [-0.5px, -0.5py]
        - ref: main_pinkie_bottom
          shift: [0.5px, -0.5py]
        - ref: main_pinkie_bottom
          shift: [0.5px, 0.1py]
        - ref: thumb_inner
          shift: [-0.5px, 1.115py]
        - ref: thumb_inner
          shift: [-0.5px, -0.5py]
        - ref: thumb_inner
          shift: [0.5px, -0.5py]
        - ref: thumb_outer
          shift: [-0.5px, -0.5py]
        - ref: thumb_outer
          shift: [0.5px, -0.5py]
        - ref: thumb_outer
          shift: [0.5px, 0.5py]
        - ref: thumb_outer
          shift: [-0.5px, 0.5py]
        - ref: main_inner_num
          shift: [1.673px, 0.5py]
        - ref: main_inner_num
          shift: [-0.319px, 0.5py]
        - ref: main_index_num
          shift: [0.5px, 0.75py]
        - ref: main_ring_num
          shift: [-0.5px, 0.75py]
        
      fillet: 2
  combo:
    - name: board
    - operation: subtract
      name: keys

pcbs:
  inkeys:
    outlines:
      main:
        outline: board
    footprints:
      choc_hotswap:
        what: choc
        where: true
        params:
          keycaps: true
          reverse: false
          hotswap: true
          from: "{{column_net}}"
          to: "{{colrow}}"
      diode:
        what: diode
        where: true
        params:
          from: "{{colrow}}"
          to: "{{row_net}}"
        adjust:
            shift: [0, -5]
      promicro:
        what: promicro
        params:
          orientation: 'down'
        where:
          ref: main_inner_top
          shift: [px,0]
          rotate: -90
      oled:
        what: oled
        params:
          side: "F"
          SDA: P2
          SCL: P3
        where:
          ref: main_inner_top
          shift: [16,-20]
          rotate: 90
      reset:
        what: button
        params:
          from: GND
          to: RST
        where:
          ref: main_inner_top
          shift: [px,0]
          rotate: -90
